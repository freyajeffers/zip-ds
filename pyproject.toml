[project]
name = "plaigarism"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Freya Jeffers", email = "fboniface@unr.edu" }
]
requires-python = ">=3.14.8,<3.15"
dependencies = [
    "pdfplumber",
    "python-docx",
    "pydantic>=2.0",
    "blake3",
    "fastapi>=0.142.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "black", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
files = ["zip_ds"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
