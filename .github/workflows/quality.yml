---
name: quality

'on':
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy zip_ds
      - run: uv run pytest -q
